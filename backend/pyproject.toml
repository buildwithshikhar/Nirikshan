[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/validation/scenarios.py" = ["E501"]  # scenario descriptions are prose
"app/validation/run.py" = ["E501"]  # markdown table rows
