# Served by nginxinc/nginx-unprivileged (port 8080, user 101). Temp paths live in /tmp (tmpfs).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Evidence images are acquired by server-side path, not uploaded through the proxy.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # analysis is synchronous (no job queue in this build): allow long requests
        proxy_read_timeout 3600s;
        proxy_buffering off;   # clip video Range responses stream through
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
