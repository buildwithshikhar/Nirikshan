# Served by nginxinc/nginx-unprivileged (port 8080, user 101). Temp paths live in /tmp (tmpfs).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Bodies are small JSON except the browser upload route below.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Browser upload: raw body streamed straight through (no buffering to the proxy's tmp). The
    # backend enforces NIRIKSHAN_MAX_UPLOAD_BYTES (default 2 GiB); raise this cap only together with it.
    location ~ ^/api/cases/[0-9]+/uploads$ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # analysis is synchronous (no job queue in this build): allow long requests
        proxy_read_timeout 3600s;
        proxy_buffering off;   # clip video Range responses stream through
    }
    location = /healthz {
        proxy_pass http://backend:8000;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
