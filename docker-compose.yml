# Local development services. The backend reads DATABASE_URL, so this can later point at any Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirikshan
      POSTGRES_PASSWORD: nirikshan
      POSTGRES_DB: nirikshan
    ports:
      - "${NIRIKSHAN_DB_PORT:-5433}:5432"
    volumes:
      - nirikshan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirikshan"]
      interval: 5s
      retries: 10

volumes:
  nirikshan_pgdata:
